services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - web-root:/var/www/html
    depends_on:
      - app
    restart: always

  mysql:
    image: mysql:8.0
    container_name: birthday-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  app:
    image: ghcr.io/kimeunsur/birthday-hansang:latest
    container_name: birthday-app
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      - mysql
    restart: always

volumes:
  mysql_data:
  web-root:
