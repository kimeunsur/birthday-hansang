name: Build & Deploy Single Container

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker 로그인 (GHCR)
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push Image
        run: |
          docker build -t ${IMAGE}:${GIT_SHA} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${GIT_SHA}
          docker push ${IMAGE}:latest

      # 서버에서 새 이미지 pull + 컨테이너 교체
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            IMAGE=${IMAGE}
            # 최신 이미지 pull
            docker pull $IMAGE:latest
            # 기존 컨테이너 있으면 종료 및 제거
            docker ps -q --filter "name=birthday-app" | grep -q . && docker stop birthday-app && docker rm birthday-app || true
            # 새 컨테이너 실행 (포트, env 필요 시 조정)
            docker run -d --name birthday-app -p 8080:8080 --env-file ~/birthday-hansang/.env $IMAGE:latest
