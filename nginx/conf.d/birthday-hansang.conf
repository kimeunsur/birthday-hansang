server {
    listen 80;
    server_name birthday-hansang.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name birthday-hansang.com;

    ssl_certificate /etc/letsencrypt/live/birthday-hansang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/birthday-hansang.com/privkey.pem;

    # /api-user로 시작 → Spring Boot
    location /api-user/ {
        proxy_pass http://app:8080/api-user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api-guest로 시작 → Spring Boot
    location /api-guest/ {
        proxy_pass http://app:8080/api-guest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api로 시작 → Spring Boot
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI → Spring Boot
    location /swagger-ui/ {
        proxy_pass http://app:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger API Docs → Spring Boot
    location /v3/api-docs {
        proxy_pass http://app:8080/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 나머지 경로 전부 Spring Boot로 프록시
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
